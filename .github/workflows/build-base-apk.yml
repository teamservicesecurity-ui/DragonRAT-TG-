name: Build Base APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug Directory Structure
        run: |
          echo "=== Root Contents ==="
          ls -la
          echo "=== Searching for gradlew ==="
          find . -name "gradlew"
          
